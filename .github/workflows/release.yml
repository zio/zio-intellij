name: Release

on: workflow_dispatch

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IJ_PLUGIN_REPO_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Scala
        uses: coursier/setup-action@v1
        with:
          jvm: adoptium:21
          apps: sbt sbtn

      - uses: coursier/cache-action@v6

      - name: Fetch Dependencies
        run: sbt +update

      - name: Package plugin
        # The first packageArtifact creates the files (including plugin.xml).
        # The second packageArtifactZip allows the patchPluginXML task to run
        #   on those files and patch the plugin.xml.
        # Then it packages files into a single zip archive.
        # TODO: remove copying of searchableOptions, they should be generated automatically by packageArtifactZip
        run: |
          sbt clean
          mkdir -p "$GITHUB_WORKSPACE/target/searchableOptions"
          cp -r "$GITHUB_WORKSPACE/src/main/resources/searchableOptions" "$GITHUB_WORKSPACE/target/"
          sbt packageArtifact && sbt packageArtifactZip

      - name: Publish plugin
        run: sbt "publishPlugin Stable"
