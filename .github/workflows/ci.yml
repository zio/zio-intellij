name: CI

on:
  push:
    branches:
      - idea252.x
      - idea253.x
      - idea261.x
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Scala
        uses: coursier/setup-action@v1
        with:
          jvm: adoptium:21
          apps: sbt sbtn

      - uses: coursier/cache-action@v6

      - name: Fetch Dependencies
        run: sbt +update

      - name: Try packaging
        # Just to check that plugin can be packaged for release
        run: sbt clean && sbt packageArtifact && sbt packageArtifactZip

      - name: Run tests
        run: sbt test
        shell: bash

